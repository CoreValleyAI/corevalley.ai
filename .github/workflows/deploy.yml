name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Pushes that touch nothing the site ships from do not redeploy. The
    # documentation lives in corevalley-docs/ (docs.corevalley.ai, see the
    # "Build docs site" step); the root docs/ folder is internal engineering notes.
    paths-ignore:
      - "docs/**"
      - "reference/**"
      - "design_system/**"
      - "files/**"
      - ".github/workflows/verify.yml"
      - "README.md"
      - "status/**"
  # Manual runs, and the CMS: after it commits published content to
  # CoreValleyAI/content it dispatches this workflow with content_only=true.
  workflow_dispatch:
    inputs:
      reason:
        description: Why this run was started
        required: false
        default: manual
      content_only:
        description: Content changed, code did not (skips the docs check and IndexNow)
        type: boolean
        required: false
        default: false
  # Every 15 minutes, off the top of the hour (GitHub drops or delays runs
  # scheduled on the hour). The gate job below makes this cheap: it rebuilds
  # only when something visible would change — a scheduled post going live,
  # or a job reaching its closing time.
  schedule:
    - cron: "7,22,37,52 * * * *"

# Least privilege: nothing by default; each job asks for what it needs.
# Only the deploy job, which runs no repository code, can publish.
permissions: {}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Where the published content lives. Read with the cv-site-deployer GitHub
  # App (vars.DEPLOYER_APP_ID + secrets.DEPLOYER_APP_KEY). Until the App is
  # set up, the site builds exactly as before, with no CMS content.
  CONTENT_OWNER: CoreValleyAI
  CONTENT_REPO: content

jobs:
  # Decides whether this run needs to build at all, and pins the content
  # commit and the clock the build will use. No concurrency group here, so a
  # scheduled run that decides to skip never cancels a real deploy.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      fingerprint: ${{ steps.decide.outputs.fingerprint }}
      content_sha: ${{ steps.decide.outputs.content_sha }}
      now: ${{ steps.decide.outputs.now }}
    steps:
      - name: Content access token
        id: token
        if: vars.DEPLOYER_APP_ID != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.DEPLOYER_APP_ID }}
          private-key: ${{ secrets.DEPLOYER_APP_KEY }}
          owner: ${{ env.CONTENT_OWNER }}
          repositories: ${{ env.CONTENT_REPO }}
          permission-contents: read

      - name: Checkout content
        if: steps.token.outcome == 'success'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          repository: ${{ env.CONTENT_OWNER }}/${{ env.CONTENT_REPO }}
          token: ${{ steps.token.outputs.token }}
          path: content
          fetch-depth: 1

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          SITE_URL: ${{ vars.SITE_URL || 'https://corevalley.ai' }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          content_sha=""
          visible=""
          if [ -f content/manifest.json ]; then
            content_sha="$(git -C content rev-parse HEAD)"
            # Items whose visibility depends on the clock: which are live now?
            visible="$(jq -r --arg now "$now" '.schedule[] | select((.from == null or .from <= $now) and (.until == null or .until > $now)) | .path' content/manifest.json | sort | tr '\n' ' ')"
          fi
          fingerprint="$(printf '%s|%s|%s' "$MAIN_SHA" "$content_sha" "$visible" | sha256sum | cut -d' ' -f1)"

          build=true
          if [ "$EVENT" = "schedule" ]; then
            deployed="$(curl -fsS "${SITE_URL%/}/_build.json?t=$(date +%s)" | jq -r '.fingerprint // empty' || true)"
            if [ "$deployed" = "$fingerprint" ]; then build=false; fi
          fi
          echo "event=$EVENT build=$build content=${content_sha:-none}"
          {
            echo "build=$build"
            echo "fingerprint=$fingerprint"
            echo "content_sha=$content_sha"
            echo "now=$now"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages reads the Pages settings to learn the base path.
      pages: read
    # A newer build supersedes an older one that hasn't finished.
    concurrency:
      group: pages-build
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # Reads the site's Pages settings and exposes the base path the site
      # will be served from: "/<repo>" for a project site (also when the
      # organisation site has a custom domain, e.g. corevalley.ai/<repo>/),
      # "" for a user site or a custom domain on this repository.
      # Read-only: Pages is already enabled, and this job may not change settings.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        continue-on-error: true

      # Fall back to the repo name only when the settings could not be read.
      # An empty base path is a valid answer ("" = served from the domain
      # root), so this must test the step's outcome, not the value — in
      # workflow expressions `'' || x` would silently pick x and every link
      # on a custom-domain site would break.
      - name: Resolve base path and site URL
        id: basepath
        env:
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: |
          # Fail closed: guessing the base path would publish a site whose
          # every link points at the wrong place.
          if [ "$PAGES_OUTCOME" != "success" ]; then
            echo "::error::Could not read the Pages settings; refusing to guess the base path"
            exit 1
          fi
          base="$PAGES_BASE_PATH"
          origin="$PAGES_ORIGIN"
          # Canonical URLs, the sitemap and structured data all build on this:
          # the address the site is actually served from, base path included.
          # When Pages serves the site from https://corevalley.ai/ it becomes
          # exactly that, with no code change.
          echo "Base path: '${base}'  Site URL: '${origin}${base}'"
          echo "value=${base}" >> "$GITHUB_OUTPUT"
          echo "site_url=${origin}${base}" >> "$GITHUB_OUTPUT"

      # The published content (jobs, posts) at the commit the gate pinned, so
      # a publish that lands mid-build waits for the next run instead of
      # half-appearing in this one.
      - name: Content access token
        id: token
        if: needs.gate.outputs.content_sha != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.DEPLOYER_APP_ID }}
          private-key: ${{ secrets.DEPLOYER_APP_KEY }}
          owner: ${{ env.CONTENT_OWNER }}
          repositories: ${{ env.CONTENT_REPO }}
          permission-contents: read

      - name: Checkout content
        if: needs.gate.outputs.content_sha != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          repository: ${{ env.CONTENT_OWNER }}/${{ env.CONTENT_REPO }}
          ref: ${{ needs.gate.outputs.content_sha }}
          token: ${{ steps.token.outputs.token }}
          path: content-src

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basepath.outputs.value }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.basepath.outputs.site_url }}
          # Optional, from repository variables (Settings → Secrets and
          # variables → Actions → Variables). Empty when unset.
          NEXT_PUBLIC_GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION }}
          NEXT_PUBLIC_BING_VERIFICATION: ${{ vars.BING_VERIFICATION }}
          NEXT_PUBLIC_DOCS_URL: ${{ vars.DOCS_URL }}
          NEXT_PUBLIC_STATUS_URL: ${{ vars.STATUS_URL }}
          CONTENT_DIR: ${{ needs.gate.outputs.content_sha != '' && format('{0}/content-src', github.workspace) || '' }}
          CONTENT_REQUIRED: ${{ needs.gate.outputs.content_sha != '' && '1' || '' }}
          CONTENT_NOW: ${{ needs.gate.outputs.now }}

      # The documentation site, docs.corevalley.ai, is this codebase built
      # with NEXT_PUBLIC_BUILD_TARGET=docs. CoreValleyAI/docs builds and
      # publishes it from this repository's main branch on its own (its
      # workflow checks for a new commit every 15 minutes); building it here
      # too keeps a change that breaks the docs from reaching main. Content
      # and scheduled runs change no code, so they skip it.
      - name: Build docs site
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.content_only)
        run: npm run build:docs

      # Only main is published on corevalley.ai. Staging builds (preview
      # branches) must never run on this origin: they would share its storage
      # and the CMS's trust. Review a branch from the Verify run's artifact,
      # or publish it from a separate repository on its own subdomain.

      # What this deploy contains. The next scheduled gate compares its
      # fingerprint with this file to decide whether to rebuild.
      - name: Write build record
        env:
          FINGERPRINT: ${{ needs.gate.outputs.fingerprint }}
          CONTENT_SHA: ${{ needs.gate.outputs.content_sha }}
          NOW: ${{ needs.gate.outputs.now }}
          REASON: ${{ inputs.reason || github.event_name }}
        run: |
          jq -n --arg fp "$FINGERPRINT" --arg content "$CONTENT_SHA" --arg main "$GITHUB_SHA" \
            --arg at "$NOW" --arg reason "$REASON" \
            '{fingerprint: $fp, content: $content, main: $main, builtAt: $at, reason: $reason}' > out/_build.json
          cat out/_build.json

      # Packaged here rather than with actions/upload-pages-artifact, whose v4
      # drops every dot-path and with it /.well-known/security.txt. Same
      # tarball and artifact name ("github-pages") that deploy-pages expects.
      - name: Package site
        run: tar --dereference --hard-dereference --directory out -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [gate, build]
    permissions:
      pages: write
      id-token: write
    # One deploy at a time, and never cancel one that has started.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      # Tell IndexNow engines (Bing, Yandex, Seznam, Naver…) every URL in the
      # sitemap may have changed. The key is public by design: it is the file
      # public/<key>.txt, which proves the site owns it. Google does not take
      # IndexNow; it reads the sitemap from Search Console. Content and
      # scheduled runs skip it.
      - name: Notify search engines (IndexNow)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.content_only)
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          INDEXNOW_KEY: 33ff8a51559595949e0134533bfcd08b
        run: |
          site="${PAGE_URL%/}"
          host="$(echo "$site" | sed -E 's#^https?://##; s#/.*##')"
          urls="$(curl -fsS "$site/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -sc .)"
          body="$(jq -nc --arg host "$host" --arg key "$INDEXNOW_KEY" --arg loc "$site/$INDEXNOW_KEY.txt" --argjson urls "$urls" '{host: $host, key: $key, keyLocation: $loc, urlList: $urls}')"
          curl -sS -o /dev/null -w 'IndexNow: HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow -H 'content-type: application/json; charset=utf-8' --data "$body"
