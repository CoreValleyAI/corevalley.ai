name: Verify

# Builds every branch and pull request exactly as the Pages deploy does
# (typecheck, lint, static export under the project base path, the docs
# site build) without deploying, so documentation and site changes are validated
# before they reach main. The export is kept as a downloadable artifact.
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Same value the deploy resolves for this project site.
  NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
  NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
  # The facts guard (lib/facts.ts) refuses numbers still marked to verify.
  # Strict on pull requests into main, where it decides what goes live;
  # relaxed on branch pushes, which are staging work.
  NEXT_PUBLIC_FACTS_STRICT: ${{ github.event_name == 'pull_request' && '1' || '0' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Known vulnerabilities and tampered packages fail the run.
      - name: Audit dependencies
        run: |
          npm audit --audit-level=moderate
          npm audit signatures

      # On pull requests: block any newly added dependency with a known
      # vulnerability or a non-permissive licence.
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build
        env:
          # Sample jobs and posts (content-fixtures/), so the job board and
          # blog pages are built and checked on every branch.
          CONTENT_FIXTURES: "1"

      # axe-core on the main pages, a sample post and a sample job, in both
      # themes, served from the export the way Pages serves it. Fails the run
      # on any violation.
      - name: Accessibility
        run: |
          npm run serve:out -- 4173 &
          sleep 2
          npm run audit:a11y -- --base "http://127.0.0.1:4173${NEXT_PUBLIC_BASE_PATH}"

      - name: Build docs site
        run: npm run build:docs

      - name: Upload export for preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-export-${{ github.sha }}
          path: ./out
          retention-days: 7
          if-no-files-found: error
